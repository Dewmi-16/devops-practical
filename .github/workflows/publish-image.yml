name: Publish v1 container image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build --label org.opencontainers.image.source=https://github.com/Dewmi-16/devops-practical -t ghcr.io/dewmi-16/devops-practical:v1 .

      - name: Run tests in image
        run: docker run --rm ghcr.io/dewmi-16/devops-practical:v1 python -m pytest

      - name: Smoke test image
        run: |
          docker run --rm -d --name flask-smoke -p 5000:5000 ghcr.io/dewmi-16/devops-practical:v1
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors http://localhost:5000/
          docker stop flask-smoke

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push image
        run: docker push ghcr.io/dewmi-16/devops-practical:v1
