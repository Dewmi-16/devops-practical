name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run PyTest
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t flask-app:v1 .

      - name: Smoke test container
        run: |
          docker run --rm -d --name flask-smoke -p 5000:5000 flask-app:v1
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors http://localhost:5000/
          docker stop flask-smoke
